package_version: 1.0.0
fixed_experiment_config:
  protocol: continuous_true_unknown_preference_A23_A35
  dataset_path: /home/bobin/imperfective_paradox_repro/assets/imperfectiveNLI.json
  dataset_sha256: ddd01d06b18b9bab24abb5bc92a8eb740bb145123658fa9a10bd86e38b4bdb5a
  expected_items: 400
  expected_groups: {A: 100, B: 100, C: 100, D: 100}
  labels: ["True", "False", "Unknown"]
  alternatives: ["True", "Unknown"]
  scoring_mode: first_answer_token_logit_margin
  scoring_formula: z_True - z_Unknown
  scoring_position: last_non_padding_prompt_token
  system_prompt: |-
    System Prompt: You are a strict logician. Your task is to determine if a Hypothesis is necessarily true given a Premise.
    If the Hypothesis MUST be true based only on the Premise, output "True".
    If the Hypothesis is contradicted by the Premise, output "False".
    If the Hypothesis might be true but is not explicitly guaranteed by the Premise, output "Unknown".
    Do not use common sense assumptions. Only use the text provided.
  user_format: "User Input: Premise: {premise} Hypothesis: {hypothesis}\nPlease respond with ONLY one of the following options: \"True\", \"False\", or \"Unknown\"."
  prompt_policy: tokenizer_chat_template_with_generation_prompt
  prompt_contract_sha256: f82e03f1a711accb305259ec09e30d165ddaba3d9a445daccb0d069f8d19f016
  folds: {count: 5, seed: 42, unit: verb, stratify: telic_atelic, assignment: shuffled_round_robin}
  random_seed: 42
  preference_basis: {components: 8, ridge_alpha: 10.0, k_thresholds: [0.5, 0.9]}
  intervention: {steering_sd: 1.0, conditions: [decision_pos, decision_neg, random_pos, random_neg, subspace_remove, random_remove]}
  stage_order: [behavior, cache, predictive_localization, causal_intervention, component_analysis, generator_localization, aggregate]
  optional_stages: [upstream_source]
  canonical_sources:
    runner: /home/bobin/imperfective_paradox_repro/telicity_intervention/qwen_full_depth_pipeline.py
    continuous_preference: /home/bobin/imperfective_paradox_repro/telicity_intervention/run_qwen_rq2bc_continuous.py
    prompt: /home/bobin/imperfective_paradox_repro/run_reproduction.py
    folds: /home/bobin/imperfective_paradox_repro/telicity_intervention/run_telicity_subspace_removal.py

